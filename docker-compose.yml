# docker-compose.yml - API + MySQL + Redis
#
# O Compose lê automaticamente o arquivo .env desta pasta para substituir as
# expressões ${VARIAVEL} abaixo. Já o "env_file" do serviço api injeta TODAS as
# variáveis do .env dentro do container da API.

services:

  # ---------------------------------------------------------------- MySQL ---
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume NOMEADO: os dados ficam fora do container e sobrevivem a
      # "docker compose down". (Só "down -v" apagaria o volume.)
      - mysql_data:/var/lib/mysql
    healthcheck:
      # "mysqladmin ping" responde com sucesso quando o servidor aceita conexões.
      # $$ evita que o Compose interprete a variável; quem expande é o shell do container.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s   # o MySQL demora na 1ª inicialização; falhas nesse período não contam

  # ---------------------------------------------------------------- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ API ---
  api:
    build:
      context: ./app
      args:
        APP_VERSION: "1.0"
    image: loja-api:1.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"   # host:container -> acesso em http://localhost:3000
    depends_on:
      # "service_healthy" espera o healthcheck do banco passar. Sem essa
      # condição, o depends_on só garantiria a ORDEM de início (container
      # criado), não que o MySQL já esteja pronto para conexões.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # alpine traz o wget do busybox; /health verifica MySQL e Redis.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
