# Secret: senhas do banco.
# ATENÇÃO: os valores abaixo são FICTÍCIOS (didáticos). Nunca coloque senhas
# reais em um repositório.
#
# base64 é apenas CODIFICAÇÃO (qualquer pessoa reverte com "base64 -d"), não
# criptografia. Gerar um valor:  printf 'valor' | base64
#   c2VuaGEtZGVtby1hcHA=  -> senha-demo-app
#   c2VuaGEtZGVtby1yb290  -> senha-demo-root
apiVersion: v1
kind: Secret
metadata:
  name: loja-secret
  namespace: n3-haruoltramariludwig-joaovitorustunomiya
  labels:
    app.kubernetes.io/part-of: loja
type: Opaque
data:
  DB_PASSWORD: c2VuaGEtZGVtby1hcHA=
  MYSQL_ROOT_PASSWORD: c2VuaGEtZGVtby1yb290
