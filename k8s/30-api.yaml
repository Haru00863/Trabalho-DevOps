# API da Loja: Deployment (2 réplicas) + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api
  namespace: n3-haruoltramariludwig-joaovitorustunomiya
  labels:
    app: loja-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loja-api       # o ReplicaSet criado pelo Deployment usa este seletor
  # Estratégia padrão (RollingUpdate), explícita para documentar o comportamento:
  # troca os pods aos poucos, sem derrubar a API (usada na Parte 4, item 2).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # pode haver 1 pod a mais durante a troca
      maxUnavailable: 0    # nunca fica menos pods prontos que o desejado
  template:
    metadata:
      labels:
        app: loja-api      # o Service seleciona pods por ESTE label
    spec:
      containers:
        - name: api
          image: loja-api:1.0
          # IfNotPresent: usa a imagem local do nó se existir. Necessário porque
          # a imagem foi construída localmente e não está em nenhum registry.
          # (Com tag ":latest" o padrão seria Always e daria erro.)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # Injeta todas as chaves do ConfigMap e do Secret como variáveis de ambiente.
          envFrom:
            - configMapRef:
                name: loja-config
            - secretRef:
                name: loja-secret
          # readiness: se falhar, o pod é REMOVIDO do Service (não recebe tráfego),
          # mas não é reiniciado. É como o Kubernetes "espera o banco ficar pronto".
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: se falhar, o container é REINICIADO. Usa /live, que não
          # depende do banco (ver comentário no server.js).
          livenessProbe:
            httpGet:
              path: /live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # requests: o que o scheduler RESERVA para o pod (e base do cálculo de
          #           % de CPU do HPA). limits: teto; acima do limite de CPU o
          #           container é limitado (throttling), acima do de memória é
          #           morto (OOMKilled).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
# Service: IP/nome estável na frente dos pods. Encontra os pods pelo seletor
# "app: loja-api" (labels) e balanceia entre os que estão Ready.
# ClusterIP = acesso interno. A demonstração de acesso é feita com
# "kubectl port-forward" (ver comandos.md).
apiVersion: v1
kind: Service
metadata:
  name: loja-api
  namespace: n3-haruoltramariludwig-joaovitorustunomiya
  labels:
    app: loja-api
spec:
  type: ClusterIP
  selector:
    app: loja-api
  ports:
    - name: http
      port: 80            # porta do Service (loja-api:80 dentro do cluster)
      targetPort: 3000    # porta do container
